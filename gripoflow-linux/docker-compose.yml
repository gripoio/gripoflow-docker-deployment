services:
  flow-nginx:
    image: gripo/flow-nginx:latest
    container_name: flow-nginx
    restart: always
    environment:
      - LISTEN_PORT=${LISTEN_PORT:?Set LISTEN_PORT in .env}
      - API_BACKEND=${API_BACKEND:?Set API_BACKEND in .env}
      - WORKFLOW_FRONTEND=${WORKFLOW_FRONTEND:?Set WORKFLOW_FRONTEND in .env}
    depends_on:
      - flow-backend
      - flow-frontend
    ports:
      - "7055:5055"
    networks:
      - gripo-flow
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"
    deploy:
      resources:
        limits:
          cpus: "0.5"       # Max 1 CPU core
          memory: 128M      # Hard memory limit
        reservations:
          cpus: "0.1"       # Guaranteed CPU
          memory: 64M       # Guaranteed memory

  flow-db:
    image: mongo:8.0.4
    container_name: flow-db
    restart: always
    volumes:
      - gripoflowdb_data_volume:/data/db
    networks:
      - gripo-flow
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"
    deploy:
      resources:
        limits:
          cpus: "1.0"        # Max 1 CPU core
          memory: 1G         # Hard memory limit
        reservations:
          cpus: "0.25"       # Guaranteed CPU
          memory: 300M       # Guaranteed memory

  flow-redis:
    image: redis:latest
    container_name: flow-redis
    restart: always
    networks:
      - gripo-flow
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"
    deploy:
      resources:
        limits:
          cpus: "0.5"        # Max 1 CPU core
          memory: 512M         # Hard memory limit
        reservations:
          cpus: "0.1"       # Guaranteed CPU
          memory: 128M       # Guaranteed memory

  flow-backend:
    image: gripo/flow-backend:latest
    user: root
    container_name: flow-backend
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./xds_bootstrap.json:/gripo-workflow/xds_bootstrap.json
    environment:
      - DB_CONNECTION_STRING=mongodb://flow-db:27017   
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:?Set DB_CONNECTION_STRING in .env}
      - TEMPORAL_SERVER_URL=${TEMPORAL_SERVER_URL:?Set TEMPORAL_SERVER_URL in .env}
      - REDIS_URL=${REDIS_URL:?Set REDIS_URL in .env}
      - SERVER_IP=${SERVER_IP:?Set SERVER_IP in .env}            
      - CLICK_HOUSE_ADDRESS=${CLICKHOUSE_ADDRESS:?Set CLICKHOUSE_ADDRESS in .env}
      - CLICK_HOUSE_DATABASE=${CLICKHOUSE_DB:?Set CLICKHOUSE_DB in .env}
      - CLICK_HOUSE_USERNAME=${CLICKHOUSE_USER:?Set CLICKHOUSE_USER in .env}
      - CLICK_HOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}       
      - DEPLOYED_ENVIRONMENT=${DEPLOYED_ENVIRONMENT:?Set DEPLOYED_ENVIRONMENT in .env} 
      - KUBERNETES_NAMESPACE=${KUBERNETES_NAMESPACE:?Set KUBERNETES_NAMESPACE in .env}
      - KUBERNETES_STORAGE_CLASS=${KUBERNETES_STORAGE_CLASS:?Set KUBERNETES_STORAGE_CLASS in .env}      
      - SANDBOX_WORKER_IMAGE=${SANDBOX_WORKER_IMAGE:?Set SANDBOX_WORKER_IMAGE in .env}
      - GRPC_XDS_BOOTSTRAP=${GRPC_XDS_BOOTSTRAP:?Set GRPC_XDS_BOOTSTRAP in .env}
      - WORKER_HEALTH_INTERVAL=${WORKER_HEALTH_INTERVAL:?Set WORKER_HEALTH_INTERVAL in .env}
      - DOCKER_NETWORK=${DOCKER_NETWORK:?Set DOCKER_NETWORK in .env}
      - XDS_SERVER_IP=${XDS_SERVER_IP:?Set XDS_SERVER_IP in .env}
      - SSH_PORT=${SSH_PORT:?Set SSH_PORT in .env}
    depends_on:
      - flow-redis
      - flow-db
    networks:
      - gripo-flow
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"
    deploy:
      resources:
        limits:
          cpus: "1.0"        # Max 1 CPU core
          memory: 1G         # Hard memory limit
        reservations:
          cpus: "0.25"       # Guaranteed CPU
          memory: 300M       # Guaranteed memory
  
  flow-frontend:
    image: gripo/flow-ui:latest
    container_name: frontend
    restart: always
    networks:
      - gripo-flow
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "1"
    deploy:
      resources:
        limits:
          cpus: "1.0"        # Max 1 CPU core
          memory: 1G         # Hard memory limit
        reservations:
          cpus: "0.25"       # Guaranteed CPU
          memory: 300M       # Guaranteed memory

  clickhouse-analysis:
    image: clickhouse/clickhouse-server:26.8.9.10-alpine
    container_name: clickhouse-analysis
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?Set CLICKHOUSE_DB in .env}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?Set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
        #- ./config.xml:/etc/clickhouse-server/config.d/production-logs.xml:ro
    networks:
      - gripo-flow
    deploy:
      resources:
        limits:
          cpus: "1.0"        # Max 1 CPU core
          memory: 1G       # Hard memory limit
        reservations:
          cpus: "0.3"       # Guaranteed CPU
          memory: 500M       # Guaranteed memory
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query 'SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  gripoflowdb_data_volume:
  clickhouse_data:
  clickhouse_logs:

networks:
  gripo-flow:
    external: true




